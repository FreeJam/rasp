<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-density="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<meta name="description" content="Расписание уроков 10–11 классов: дни слева, уроки сверху. По классам, учителям и кабинетам, фильтры по группам и типам занятий.">
<title>Расписание уроков</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=16">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-hex" aria-hidden="true"></div>
<div class="bg-drift" id="bgDrift" aria-hidden="true"></div>
<div class="bg-art" id="bgArt" aria-hidden="true"></div>

<div class="scrollbar" aria-hidden="true"><div class="thumb" id="scrollThumb"></div></div>

<div class="app">

  <h1 class="sr-only">Расписание уроков 10–11 классов</h1>

  <header class="bar">
    <div class="bar-art" id="barArt" aria-hidden="true"></div>
    <div class="bar-inner">
      <div class="segmented" role="tablist" aria-label="Что показывать">
        <button class="seg-btn is-active" role="tab" aria-selected="true" data-mode="class" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/></svg>
          <span>Класс</span>
        </button>
        <button class="seg-btn" role="tab" aria-selected="false" data-mode="teacher" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v13"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19"/><path d="M9 7h6"/></svg>
          <span>Учитель</span>
        </button>
        <button class="seg-btn" role="tab" aria-selected="false" data-mode="room" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9.5 21v-5h5v5"/></svg>
          <span>Кабинет</span>
        </button>
      </div>

      <button class="live" id="live" type="button" title="Перейти к сегодняшнему дню">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="live-text" id="liveText"></span>
        <span class="live-sub" id="liveSub"></span>
        <span class="live-bar" aria-hidden="true"><i id="liveBar"></i></span>
      </button>
    </div>
  </header>

  <div class="controls">
    <div class="control-row">
      <button class="picker" id="pickBtn" type="button" aria-haspopup="dialog">
        <span class="picker-val" id="pickVal">—</span>
        <svg class="picker-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="icon-btn" id="searchBtn" type="button" aria-label="Поиск">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="filterBtn" type="button" aria-label="Фильтры">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span class="dot" id="filterDot" hidden></span>
      </button>
      <button class="reset-btn" id="resetBtn" type="button" aria-label="Сбросить фильтры" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4.5V10h5.5"/></svg>
        <span>Сбросить</span>
      </button>
    </div>
  </div>

  <div class="board-frame">
    <i class="hud tl" aria-hidden="true"></i>
    <i class="hud tr" aria-hidden="true"></i>
    <i class="hud bl" aria-hidden="true"></i>
    <i class="hud br" aria-hidden="true"></i>
    <main id="board">
      <div class="skeleton"></div>
    </main>
  </div>

  <footer class="foot">
    <span class="foot-actions">
      <button class="link-btn" id="themeBtn" type="button">Тема</button>
      <button class="link-btn" id="bellsBtn" type="button">Звонки</button>
      <button class="link-btn" id="printBtn" type="button">Печать</button>
    </span>
  </footer>

</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" id="sheetBack"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="nav-btn" id="sheetClose" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/app.js?v=18"></script>
</body>
</html>
